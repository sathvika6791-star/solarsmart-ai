<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; font-family:Inter,"Segoe UI",Arial,sans-serif; }
  #wrap { position:relative; width:100%; height:400px; border-radius:16px; overflow:hidden;
          border:1px solid rgba(120,160,255,.25); box-shadow:0 0 28px rgba(80,120,255,.18) inset; background:#070b18; }
  canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .hud { position:absolute; left:12px; top:10px; padding:6px 12px; border-radius:10px; color:#e8eefc;
         background:rgba(10,16,34,.72); border:1px solid rgba(255,184,0,.45); font-size:13px; backdrop-filter:blur(4px); pointer-events:none; }
  .hud b { color:#ffb800; font-size:17px; }
  .hint { position:absolute; right:12px; bottom:10px; color:#8fa3c9; font-size:12px; pointer-events:none;
          background:rgba(10,16,34,.6); padding:4px 10px; border-radius:8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="hint" id="hint"></div>
</div>
<script src="three.min.js"></script>
<script>
// ---------------- Streamlit component protocol (no build step needed) ----------------
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
const setValue = (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" });
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 402 });

let args = null, dragging = false, lastSent = 0;
let scene, camera, renderer, mode = null, api = null;
const canvas = document.getElementById("c"), hud = document.getElementById("hud"), hint = document.getElementById("hint");
const mouse = { x: 0, y: 0 };

window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  args = e.data.args;
  if (!mode) { mode = args.mode; build(); }
  if (!dragging) api.apply(args);
});

// ---------------- helpers ----------------
function glowSprite(color, size) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, color); grd.addColorStop(0.35, color.replace("1)", "0.35)")); grd.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size, size, 1); return s;
}
function labelSprite(w, h, scale) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.scale.set(scale, scale * h / w, 1);
  s.setText = (t, color) => { const g = c.getContext("2d"); g.clearRect(0, 0, w, h); g.font = "bold " + (h * 0.55) + "px Segoe UI, Arial";
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = color || "#e8eefc"; g.fillText(t, w / 2, h / 2); tex.needsUpdate = true; };
  return s;
}
function pointerRay(ev) {
  const r = canvas.getBoundingClientRect();
  const v = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -(((ev.clientY - r.top) / r.height) * 2 - 1));
  const rc = new THREE.Raycaster(); rc.setFromCamera(v, camera); return rc.ray;
}
function intersect(ev, plane) { const p = new THREE.Vector3(); return pointerRay(ev).intersectPlane(plane, p) ? p : null; }
function emit(value, force) {
  const now = performance.now();
  if (force || now - lastSent > 220) { lastSent = now; value.nonce = Date.now() + Math.random(); setValue(value); }
}

// ---------------- scene shell ----------------
function build() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b18);
  scene.fog = new THREE.Fog(0x070b18, 10, 26);
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  scene.add(new THREE.AmbientLight(0x8fa8ff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(3, 8, 5); scene.add(key);
  const grid = new THREE.GridHelper(30, 30, 0x2a3f7a, 0x16224a); grid.position.y = -0.7; scene.add(grid);
  api = (mode === "angle") ? buildAngle() : buildShade();

  function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener("resize", resize); resize();

  canvas.addEventListener("pointerdown", (e) => { dragging = true; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); api.drag(e, false); });
  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.y = ((e.clientY - r.top) / r.height) * 2 - 1;
    if (dragging) api.drag(e, false);
  });
  const end = (e) => { if (!dragging) return; dragging = false; canvas.classList.remove("drag"); api.drag(e, true); };
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);

  const clock = new THREE.Clock();
  (function loop() {
    const t = clock.getElapsedTime();
    // gentle parallax so the scene feels 3D even without dragging
    const base = api.camera, px = mouse.x * 1.3, py = mouse.y * 0.5;
    camera.position.x += (base[0] + px - camera.position.x) * 0.06;
    camera.position.y += (base[1] - py - camera.position.y) * 0.06;
    camera.position.z = base[2];
    camera.lookAt(base[3], base[4], base[5]);
    api.tick(t);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
  if (args) api.apply(args);
}

// ---------------- panel texture ----------------
function panelTexture(cols, rows) {
  const c = document.createElement("canvas"); c.width = 768; c.height = 512; const g = c.getContext("2d");
  g.fillStyle = "#0a1a3d"; g.fillRect(0, 0, c.width, c.height);
  const cw = c.width / cols, rh = c.height / rows;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const grd = g.createLinearGradient(k * cw, r * rh, (k + 1) * cw, (r + 1) * rh);
    grd.addColorStop(0, "#1d4fb8"); grd.addColorStop(1, "#0f2c75");
    g.fillStyle = grd; g.fillRect(k * cw + 3, r * rh + 3, cw - 6, rh - 6);
    g.strokeStyle = "rgba(190,215,255,.35)"; g.lineWidth = 1;
    for (let b = 1; b < 3; b++) { g.beginPath(); g.moveTo(k * cw + (cw * b) / 3, r * rh + 3); g.lineTo(k * cw + (cw * b) / 3, (r + 1) * rh - 3); g.stroke(); }
  }
  return new THREE.CanvasTexture(c);
}

// =============================== ANGLE SCENE ===============================
function buildAngle() {
  const R = 3.6, state = { angle: 0, factor: 1 };
  hint.textContent = "Drag anywhere to swing the sun";

  const panel = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.18, 4),
    new THREE.MeshStandardMaterial({ map: panelTexture(8, 5), metalness: 0.55, roughness: 0.3 }));
  scene.add(panel);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 3.8),
    new THREE.MeshBasicMaterial({ color: 0xffb800, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = 0.1; scene.add(glow);

  // normal (perpendicular) - dashed cyan
  const nGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.1, 0), new THREE.Vector3(0, R + 0.4, 0)]);
  const normal = new THREE.Line(nGeo, new THREE.LineDashedMaterial({ color: 0x38d9ff, dashSize: 0.18, gapSize: 0.12 }));
  normal.computeLineDistances(); scene.add(normal);
  const nLab = labelSprite(256, 64, 1.9); nLab.position.set(0.15, R + 0.75, 0); nLab.setText("normal", "#38d9ff"); scene.add(nLab);

  // faint quarter orbit, bright part up to the current angle
  const orbitPts = []; for (let a = 0; a <= 90; a += 2) orbitPts.push(new THREE.Vector3(R * Math.sin(a * Math.PI / 180), R * Math.cos(a * Math.PI / 180), 0));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitPts), new THREE.LineBasicMaterial({ color: 0x3b4f8f, transparent: true, opacity: 0.6 })));
  let arc = null;

  const sun = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffc933 }));
  const halo = glowSprite("rgba(255,190,40,1)", 2.6); sun.add(halo);
  const sunLight = new THREE.PointLight(0xffc060, 1.4, 14); sun.add(sunLight); scene.add(sun);

  const ray = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 12), new THREE.MeshBasicMaterial({ color: 0xffd24d, transparent: true, opacity: 0.85 }));
  scene.add(ray);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.42, 20), new THREE.MeshBasicMaterial({ color: 0xffd24d })); scene.add(head);
  const angLab = labelSprite(256, 80, 1.8); scene.add(angLab);

  const N = 18, photons = [];
  for (let i = 0; i < N; i++) { const p = glowSprite("rgba(255,220,120,1)", 0.5); scene.add(p); photons.push({ s: p, o: i / N }); }

  function place() {
    const th = state.angle * Math.PI / 180, dir = new THREE.Vector3(Math.sin(th), Math.cos(th), 0);
    const target = new THREE.Vector3(0, 0.1, 0), pos = dir.clone().multiplyScalar(R);
    sun.position.copy(pos);
    const len = pos.distanceTo(target) - 0.3;
    ray.scale.set(1, len, 1); ray.position.copy(pos.clone().add(target).multiplyScalar(0.5));
    ray.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().negate());
    head.position.copy(target.clone().add(dir.clone().multiplyScalar(0.24)));
    head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().negate());
    if (arc) { scene.remove(arc); arc.geometry.dispose(); }
    const pts = []; for (let a = 0; a <= state.angle + 0.01; a += 1) pts.push(new THREE.Vector3(1.5 * Math.sin(a * Math.PI / 180), 1.5 * Math.cos(a * Math.PI / 180), 0));
    if (pts.length < 2) pts.push(new THREE.Vector3(0, 1.5, 0.001), new THREE.Vector3(0, 1.5, 0.002));
    arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffb800 })); scene.add(arc);
    const mid = th / 2; angLab.position.set(2.1 * Math.sin(mid) + 0.45, 2.1 * Math.cos(mid), 0);
    angLab.setText(state.angle.toFixed(1) + "°", "#ffd24d");
    glow.material.opacity = 0.05 + 0.38 * state.factor;
    hud.innerHTML = "Angle <b>" + state.angle.toFixed(1) + "°</b> &nbsp;·&nbsp; cos = " + state.factor.toFixed(3) +
      " &nbsp;→&nbsp; <b>" + (state.factor * 100).toFixed(0) + "%</b> of direct beam";
  }
  const floor = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  return {
    camera: [0, 4.6, 10.5, 0, 1.3, 0],
    apply(a) { state.angle = a.angle; state.factor = a.factor; place(); },
    drag(e, final) {
      const p = intersect(e, floor); if (!p) return;
      let th = Math.atan2(p.x, p.y) * 180 / Math.PI;
      th = Math.max(0, Math.min(90, Math.round(th * 2) / 2));
      state.angle = th; state.factor = th >= 90 ? 0 : Math.cos(th * Math.PI / 180); place();
      emit({ angle: th }, final);
    },
    tick(t) {
      const th = state.angle * Math.PI / 180, dir = new THREE.Vector3(Math.sin(th), Math.cos(th), 0), target = new THREE.Vector3(0, 0.1, 0);
      photons.forEach((p) => { const f = (p.o + t * 0.35) % 1; p.s.position.copy(dir.clone().multiplyScalar(R * (1 - f)).add(target.clone().multiplyScalar(f))); p.s.material.opacity = 1 - f * 0.3; });
      halo.scale.setScalar(2.6 + Math.sin(t * 3) * 0.12);
    }
  };
}

// =============================== SHADE SCENE ===============================
function buildShade() {
  const W = 7.2, D = 3.8, COLS = 12, ROWS = 6, cw = W / COLS, rd = D / ROWS;
  const state = { shade: 0, factor: 1, states: [] };
  hint.textContent = "Drag the cloud across the panel";

  const base = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, 0.14, D + 0.3), new THREE.MeshStandardMaterial({ color: 0x9aa7c7, metalness: 0.8, roughness: 0.35 }));
  base.position.y = -0.1; scene.add(base);
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let k = 0; k < COLS; k++) {
    const m = new THREE.MeshStandardMaterial({ color: 0x1d55c8, emissive: 0x0a2a6e, emissiveIntensity: 0.9, metalness: 0.5, roughness: 0.3 });
    const cell = new THREE.Mesh(new THREE.BoxGeometry(cw - 0.06, 0.07, rd - 0.06), m);
    cell.position.set(-W / 2 + (k + 0.5) * cw, 0.02, -D / 2 + (r + 0.5) * rd); scene.add(cell); cells.push({ m: m, k: k });
  }
  // shadow slab + glowing edge
  const shadow = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, D + 0.1), new THREE.MeshBasicMaterial({ color: 0x02040c, transparent: true, opacity: 0.68 }));
  shadow.position.y = 0.1; scene.add(shadow);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, D + 0.2), new THREE.MeshBasicMaterial({ color: 0xffb800 })); edge.position.y = 0.12; scene.add(edge);

  // cloud made of soft spheres
  const cloud = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color: 0xcfd9f2, roughness: 1, emissive: 0x42507a, emissiveIntensity: 0.5 });
  [[0, 0, 0, 0.8], [0.8, 0.1, 0.3, 0.65], [-0.8, 0, -0.2, 0.62], [0.2, 0.28, -0.5, 0.58], [-0.3, 0.2, 0.55, 0.55], [1.3, -0.05, -0.3, 0.45], [-1.3, -0.05, 0.2, 0.42]]
    .forEach((s) => { const m = new THREE.Mesh(new THREE.SphereGeometry(s[3], 24, 24), cm); m.position.set(s[0], s[1], s[2]); cloud.add(m); });
  cloud.position.y = 2.0; scene.add(cloud);

  const sep = new THREE.Group(); scene.add(sep);
  const diodes = new THREE.Group(); scene.add(diodes);

  // falling light particles (blocked by the cloud over the shaded area)
  const NP = 90, pos = new Float32Array(NP * 3), seeds = [];
  for (let i = 0; i < NP; i++) seeds.push({ x: (Math.random() - 0.5) * W, z: (Math.random() - 0.5) * D, f: Math.random() });
  const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(pgeo, new THREE.PointsMaterial({ color: 0xffd24d, size: 0.1, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(pts);

  function place() {
    const xs = -W / 2 + (state.shade / 100) * W;
    const w = Math.max(0.001, xs + W / 2);
    shadow.visible = state.shade > 0; shadow.scale.x = w; shadow.position.x = -W / 2 + w / 2;
    edge.visible = state.shade > 0 && state.shade < 100; edge.position.x = xs;
    cloud.position.x = Math.max(-W / 2 - 1.6, xs - 0.6);
    cells.forEach((c) => {
      const x0 = -W / 2 + c.k * cw, cov = Math.max(0, Math.min(1, (xs - x0) / cw));
      c.m.color.setRGB(0.11 * (1 - cov) + 0.03 * cov, 0.33 * (1 - cov) + 0.04 * cov, 0.78 * (1 - cov) + 0.08 * cov);
      c.m.emissiveIntensity = 0.9 * (1 - cov) + 0.05 * cov;
    });
    while (sep.children.length) sep.remove(sep.children[0]);
    while (diodes.children.length) diodes.remove(diodes.children[0]);
    const n = state.states.length;
    if (n) {
      for (let k = 0; k < n; k++) {
        if (k) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, D), new THREE.MeshBasicMaterial({ color: 0xe8eefc })); b.position.set(-W / 2 + (W * k) / n, 0.07, 0); sep.add(b); }
        const st = state.states[k].state, col = st === "active" ? 0x34d399 : st === "partial" ? 0xffb800 : 0x6b7690;
        const xc = -W / 2 + (W * (k + 0.5)) / n;
        const d = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 20), new THREE.MeshBasicMaterial({ color: col })); d.position.set(xc, 0, D / 2 + 0.55); diodes.add(d);
        const g = glowSprite("rgba(" + (st === "active" ? "52,211,153" : st === "partial" ? "255,184,0" : "107,118,144") + ",1)", 0.9); g.position.copy(d.position); diodes.add(g);
        const l = labelSprite(256, 64, 1.5); l.position.set(xc, 0.55, D / 2 + 0.55); l.setText("D" + (k + 1) + " " + st, "#cfd9ea"); diodes.add(l);
      }
    }
    hud.innerHTML = "Shaded <b>" + state.shade.toFixed(0) + "%</b> &nbsp;·&nbsp; output kept ≈ <b>" + (state.factor * 100).toFixed(1) + "%</b>";
  }
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.1);
  return {
    camera: [0, 8.2, 8.6, 0, 0.4, 0.3],
    apply(a) { state.shade = a.shade; state.factor = a.factor; state.states = a.states || []; place(); },
    drag(e, final) {
      const p = intersect(e, plane); if (!p) return;
      const s = Math.max(0, Math.min(100, Math.round(((p.x + W / 2) / W) * 100)));
      state.shade = s; place(); emit({ shade: s }, final);
    },
    tick(t) {
      const xs = -W / 2 + (state.shade / 100) * W;
      for (let i = 0; i < NP; i++) {
        const sd = seeds[i], f = (sd.f + t * 0.22) % 1, y = 3.6 * (1 - f) + 0.1, blocked = sd.x < xs;
        pos[i * 3] = sd.x; pos[i * 3 + 1] = (blocked && y < 1.9) ? -50 : y; pos[i * 3 + 2] = sd.z;
      }
      pgeo.attributes.position.needsUpdate = true;
      cloud.position.y = 2.0 + Math.sin(t * 1.2) * 0.08;
    }
  };
}
</script>
</body>
</html>
